  name             : "Junteng Liu"
  avatar           : "profile.png"
  bio              : "First-year PhD candidate at HKUST NLP Group. My research focuses on natural language processing and machine learning. Research interests include LLM Reasoning and Reinforcement Learning, Hallucination in Vision-Language Models, and LLM Truthfulness and Interpretability."
