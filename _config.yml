# Basic Site Settings
locale                   : "en-US"
title                    : "Junteng Liu"
title_separator          : "-"
subtitle                 : # site tagline that appears below site title in masthead
name                     : "Junteng Liu"
description              : "Personal website of Junteng Liu, PhD candidate at HKUST NLP Group."
url                      : "https://romdruidpath.github.io"
baseurl                  : "/LJT-Homepage"
repository               : "romdruidpath/LJT-Homepage"

# Site Author
